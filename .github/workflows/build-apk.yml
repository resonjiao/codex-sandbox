name: 编译票点助手 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PiaoDianHelper_V1_BuildReady.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          test -f PiaoDianHelper_V1_BuildReady.zip
          mkdir -p build-input
          unzip -q PiaoDianHelper_V1_BuildReady.zip -d build-input
          test -f build-input/PiaoDianHelper_V1/settings.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: build-input/PiaoDianHelper_V1
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Checksum
        run: sha256sum build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/app-debug.apk > build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiaoDianHelper-V1-APK
          path: |
            build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/app-debug.apk
            build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 14
          if-no-files-found: error
