name: 编译票点助手 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PiaoDianHelper_V1_BuildReady.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 下载仓库内容
        uses: actions/checkout@v4

      - name: 检查并解压安卓工程
        shell: bash
        run: |
          test -f PiaoDianHelper_V1_BuildReady.zip || { echo '请先把 PiaoDianHelper_V1_BuildReady.zip 上传至仓库根目录'; exit 1; }
          mkdir -p build-input
          unzip -q PiaoDianHelper_V1_BuildReady.zip -d build-input
          test -f build-input/PiaoDianHelper_V1/settings.gradle

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: 设置 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 编译 debug APK
        working-directory: build-input/PiaoDianHelper_V1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: 创建校验值
        run: sha256sum build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/app-debug.apk > build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/SHA256.txt

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: PiaoDianHelper-V1-APK
          path: |
            build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/app-debug.apk
            build-input/PiaoDianHelper_V1/app/build/outputs/apk/debug/SHA256.txt
          retention-days: 14
          if-no-files-found: error
